suite: pgstac configuration tests
templates:
  - templates/_helpers/core.tpl
  - templates/_helpers/database.tpl
  - templates/database/pgstacbootstrap/configmap.yaml
  - templates/database/pgstacbootstrap/queue-processor.yaml
  - templates/database/pgstacbootstrap/maintenance.yaml
tests:
  # PgSTAC Settings Tests
  - it: should apply custom pgstac settings
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          pgstacSettings:
            queue_timeout: "30 minutes"
            use_queue: "false"
            update_collection_extent: "scheduled"
            context: "on"
            context_estimated_count: "50000"
    template: templates/database/pgstacbootstrap/configmap.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["pgstac-settings.sql"]
          pattern: "VALUES \\('queue_timeout', '30 minutes'\\)"
      - matchRegex:
          path: data["pgstac-settings.sql"]
          pattern: "VALUES \\('use_queue', 'false'\\)"
      - matchRegex:
          path: data["pgstac-settings.sql"]
          pattern: "VALUES \\('update_collection_extent', 'false'\\)"
      - matchRegex:
          path: data["pgstac-settings.sql"]
          pattern: "VALUES \\('context_estimated_count', '50000'\\)"

  - it: should use default pgstac settings
    set:
      pgstacBootstrap:
        enabled: true
    template: templates/database/pgstacbootstrap/configmap.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["pgstac-settings.sql"]
          pattern: "VALUES \\('queue_timeout', '10 minutes'\\)"
      - matchRegex:
          path: data["pgstac-settings.sql"]
          pattern: "VALUES \\('use_queue', 'false'\\)"
      - matchRegex:
          path: data["pgstac-settings.sql"]
          pattern: "VALUES \\('update_collection_extent', 'true'\\)"

  # Queue Processor Tests
  - it: should create queue processor when use_queue is true
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          pgstacSettings:
            use_queue: "true"
    template: templates/database/pgstacbootstrap/queue-processor.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pgstac-queue-processor
      - equal:
          path: spec.schedule
          value: "0 * * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never

  - it: should NOT create queue processor when use_queue is false
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          pgstacSettings:
            use_queue: "false"
    template: templates/database/pgstacbootstrap/queue-processor.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should use custom queue processor schedule
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          pgstacSettings:
            use_queue: "true"
          queueProcessor:
            schedule: "*/15 * * * *"
    template: templates/database/pgstacbootstrap/queue-processor.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "*/15 * * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[2]
          value: |
            psql -c "CALL pgstac.run_queued_queries();"

  # Maintenance Tests
  - it: should create maintenance when update_collection_extent is scheduled
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          pgstacSettings:
            update_collection_extent: "scheduled"
    template: templates/database/pgstacbootstrap/maintenance.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pgstac-maintenance
      - equal:
          path: spec.schedule
          value: "0 2 * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[2]
          value: |
            set -e
            psql -c "SELECT pgstac.update_collection_extents();"

  - it: should NOT create maintenance when update_collection_extent is false
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          pgstacSettings:
            update_collection_extent: "false"
    template: templates/database/pgstacbootstrap/maintenance.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should run ANALYZE after extents with custom maintenance settings
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          analyze: both
          pgstacSettings:
            update_collection_extent: "scheduled"
          maintenance:
            schedule: "0 */6 * * *"
            activeDeadlineSeconds: 3600
          extraEnv:
            - name: PGOPTIONS
              value: "-c statement_timeout=0"
    template: templates/database/pgstacbootstrap/maintenance.yaml
    asserts:
      - equal:
          path: spec.schedule
          value: "0 */6 * * *"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[2]
          value: |
            set -e
            psql -c "SELECT pgstac.update_collection_extents();"
            psql -c "ANALYZE;"
      - equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 3600
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: PGOPTIONS
            value: "-c statement_timeout=0"

  - it: should run only ANALYZE when analyze is scheduled
    set:
      pgstacBootstrap:
        settings:
          analyze: scheduled
    template: templates/database/pgstacbootstrap/maintenance.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[2]
          value: |
            set -e
            psql -c "ANALYZE;"

  # Combined scenario tests
  - it: should create both cronjobs with proper settings
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          pgstacSettings:
            use_queue: "true"
            update_collection_extent: "scheduled"
    templates:
      - templates/database/pgstacbootstrap/queue-processor.yaml
      - templates/database/pgstacbootstrap/maintenance.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: CronJob

  - it: should not create any cronjobs when disabled
    set:
      pgstacBootstrap:
        enabled: false
    templates:
      - templates/database/pgstacbootstrap/queue-processor.yaml
      - templates/database/pgstacbootstrap/maintenance.yaml
    asserts:
      - hasDocuments:
          count: 0

  # Resource limits tests
  - it: should set correct resource limits for queue processor
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          pgstacSettings:
            use_queue: "true"
    template: templates/database/pgstacbootstrap/queue-processor.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.cpu
          value: "256m"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: "512Mi"

  - it: should set correct resource limits for maintenance
    set:
      pgstacBootstrap:
        enabled: true
        settings:
          pgstacSettings:
            update_collection_extent: "scheduled"
    template: templates/database/pgstacbootstrap/maintenance.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.cpu
          value: "512m"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: "1024Mi"
