{{- if .Values.pgstacBootstrap.enabled }}
{{- $extents := eq .Values.pgstacBootstrap.settings.pgstacSettings.update_collection_extent "scheduled" }}
{{- $analyze := has .Values.pgstacBootstrap.settings.analyze (list "scheduled" "both") }}
{{- if or $extents $analyze }}
{{- $maintenance := .Values.pgstacBootstrap.settings.maintenance }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-pgstac-maintenance
  labels:
    {{- include "eoapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgstac-maintenance
spec:
  schedule: {{ $maintenance.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      {{- with $maintenance.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "eoapi.labels" . | nindent 12 }}
            app.kubernetes.io/component: pgstac-maintenance
        spec:
          restartPolicy: Never
          {{- with .Values.pgstacBootstrap.settings.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: maintenance
            image: {{ include "eoapi.containerImage" .Values.pgstacBootstrap.image }}
            imagePullPolicy: {{ .Values.pgstacBootstrap.image.pullPolicy | default "IfNotPresent" }}
            command:
              - "/bin/sh"
              - "-c"
              - |
                set -e
                {{- if $extents }}
                psql -c "SET search_path TO pgstac, public" -c "SELECT pgstac.update_collection_extents();"
                {{- end }}
                {{- if $analyze }}
                psql -c "ANALYZE;"
                {{- end }}
            env:
              {{- include "eoapi.pgstacBootstrapEnv" . | nindent 14 }}
            resources:
              {{- toYaml $maintenance.resources | nindent 14 }}
            {{- with .Values.pgstacBootstrap.settings.securityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
{{- end }}
