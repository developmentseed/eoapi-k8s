{{- if .Values.pgstacBootstrap.enabled }}
{{- if .Values.pgstacBootstrap.settings.pgstacSettings }}
{{- if eq (.Values.pgstacBootstrap.settings.pgstacSettings.use_queue | default "true") "true" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-pgstac-queue-processor
  labels:
    {{- include "eoapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgstac-queue
spec:
  schedule: {{ .Values.pgstacBootstrap.settings.queueProcessor.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      {{- with .Values.pgstacBootstrap.settings.queueProcessor.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "eoapi.labels" . | nindent 12 }}
            app.kubernetes.io/component: pgstac-queue
        spec:
          restartPolicy: Never
          {{- with .Values.pgstacBootstrap.settings.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: queue-processor
            image: {{ include "eoapi.containerImage" .Values.pgstacBootstrap.image }}
            imagePullPolicy: {{ .Values.pgstacBootstrap.image.pullPolicy | default "IfNotPresent" }}
            command:
              - "/bin/sh"
              - "-c"
              - |
                psql -c "CALL pgstac.run_queued_queries();"
            env:
              {{- include "eoapi.pgstacBootstrapEnv" . | nindent 14 }}
            resources:
              {{- toYaml .Values.pgstacBootstrap.settings.queueProcessor.resources | nindent 14 }}
            {{- with .Values.pgstacBootstrap.settings.securityContext }}
            securityContext:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
{{- end }}
{{- end }}
