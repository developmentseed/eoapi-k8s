{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") }}
{{- $flags := include "eoapi.ingressFlags" . | fromJson -}}
{{- if not (empty $flags.stripPrefixes) }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-strip-prefix-middleware
  labels:
    app: {{ .Release.Name }}-ingress
spec:
  stripPrefix:
    prefixes:
      {{- range $flags.stripPrefixes }}
      - {{ . }}
      {{- end }}
{{- end }}
{{- end }}
